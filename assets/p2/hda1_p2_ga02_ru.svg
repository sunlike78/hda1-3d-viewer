<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <style>
    .bg{fill:#f7f8f7}.title{font:700 34px Arial,sans-serif;fill:#1d2730}.sub{font:500 18px Arial,sans-serif;fill:#46545d}.h{font:700 21px Arial,sans-serif;fill:#1d2730}.t{font:400 17px Arial,sans-serif;fill:#202b33}.s{font:400 14px Arial,sans-serif;fill:#3c4a54}.dim{font:600 16px Arial,sans-serif;fill:#245a85}.note{font:500 15px Arial,sans-serif;fill:#38526a}.small{font:400 13px Arial,sans-serif;fill:#40505a}.line{stroke:#273741;stroke-width:3;fill:none}.thin{stroke:#586974;stroke-width:1.5;fill:none}.dash{stroke:#586974;stroke-width:1.5;stroke-dasharray:7 6;fill:none}.cut{fill:#e8eef0;stroke:#273741;stroke-width:3}.steel{fill:#d6dde0;stroke:#273741;stroke-width:3}.food{fill:#bde4df;stroke:#216d68;stroke-width:3}.tool{fill:#d8e0e5;stroke:#24465a;stroke-width:3}.accent{fill:#e84a36;stroke:#972d20;stroke-width:2}.box{fill:#fff;stroke:#9badb6;stroke-width:2}.bluebox{fill:#f1f7fb;stroke:#5286a9;stroke-width:2}.orangebox{fill:#fff6ed;stroke:#ba7d46;stroke-width:2}.greenbox{fill:#f1f8f2;stroke:#5a9362;stroke-width:2}</style>
  <rect class="bg" width="1800" height="1200"/>
  <text x="54" y="58" class="title">HDA-1 — главный узел P2: камера, верхний привод и съёмная мешалка</text>
  <text x="56" y="88" class="sub">Сборочный предконструкторский лист GA-02 · бытовая порция 350–500 г · статус: P2, не заводская КД</text>
  <line x1="52" y1="108" x2="1748" y2="108" class="thin"/>

  <text x="60" y="138" class="h">Разрез камеры</text>
  <!-- Chamber / section -->
  <path d="M190 228 L190 672 Q190 704 222 704 L568 704 Q600 704 600 672 L600 228 Z" class="cut"/>
  <path d="M204 232 L204 680 L586 680 L586 232" class="line"/>
  <!-- upper flange, lid, ring -->
  <rect x="166" y="208" width="458" height="28" rx="6" class="steel"/>
  <rect x="176" y="170" width="438" height="40" rx="8" class="steel"/>
  <rect x="146" y="150" width="498" height="22" rx="5" fill="#e1a534" stroke="#80591b" stroke-width="3"/>
  <rect x="226" y="137" width="338" height="11" rx="5" class="accent"/>
  <!-- shaft and seal -->
  <rect x="383" y="84" width="40" height="436" class="tool"/>
  <rect x="355" y="206" width="96" height="42" rx="7" fill="#263945" stroke="#172630" stroke-width="3"/>
  <rect x="348" y="248" width="110" height="21" rx="5" class="accent"/>
  <rect x="360" y="270" width="86" height="38" rx="7" fill="#273945" stroke="#172630" stroke-width="3"/>
  <!-- form -->
  <path d="M250 334 L250 628 Q250 644 266 644 L540 644 Q556 644 556 628 L556 334" class="food"/>
  <rect x="238" y="323" width="330" height="20" rx="7" class="food"/>
  <!-- tool: double ribbon & disperser -->
  <path d="M347 552 C285 525 282 448 342 413 C405 376 498 405 497 468 C496 519 430 552 365 523" class="tool"/>
  <path d="M460 552 C520 525 522 448 462 413 C399 376 306 405 307 468 C308 519 374 552 439 523" class="tool"/>
  <rect x="383" y="308" width="40" height="192" class="tool"/>
  <!-- no lower support clear gap -->
  <line x1="330" y1="636" x2="476" y2="636" class="dash"/>
  <text x="305" y="666" class="dim">Зазор до цельного дна: 8 мм · нижней опоры нет</text>
  <!-- red safety valve -->
  <rect x="184" y="395" width="58" height="22" rx="10" class="accent"/>
  <rect x="150" y="365" width="24" height="90" rx="10" class="accent"/>
  <circle cx="162" cy="360" r="21" class="accent"/>
  <rect x="134" y="430" width="38" height="18" rx="7" class="accent"/>
  <!-- dimensions no arrows -->
  <line x1="190" y1="732" x2="600" y2="732" class="thin"/><line x1="190" y1="720" x2="190" y2="744" class="thin"/><line x1="600" y1="720" x2="600" y2="744" class="thin"/>
  <text x="332" y="759" class="dim">Камера: внутр. Ø210 · наруж. Ø215</text>
  <line x1="640" y1="228" x2="640" y2="704" class="thin"/><line x1="628" y1="228" x2="652" y2="228" class="thin"/><line x1="628" y1="704" x2="652" y2="704" class="thin"/>
  <text x="660" y="468" class="dim">Высота камеры 142</text>
  <line x1="250" y1="774" x2="556" y2="774" class="thin"/><line x1="250" y1="764" x2="250" y2="784" class="thin"/><line x1="556" y1="764" x2="556" y2="784" class="thin"/>
  <text x="310" y="802" class="dim">Форма: внутр. Ø150 × 95 = 1,68 л</text>
  <text x="310" y="827" class="dim">Инструмент: Ø134 · радиальный зазор 8 мм</text>

  <!-- right information -->
  <rect x="770" y="136" width="970" height="276" rx="12" class="bluebox"/>
  <text x="798" y="170" class="h">Принятые решения P2</text>
  <text x="798" y="204" class="t">1. Верхний привод и вал Ø20; в форме нет отверстия, подшипника или опоры.</text>
  <text x="798" y="234" class="t">2. Цельная съёмная форма: Ø150 × 95 мм, номинальный объём 1,68 л.</text>
  <text x="798" y="264" class="t">3. Рабочий орган A: две открытые ленты; вариант B с кольцом остаётся стендовой альтернативой.</text>
  <text x="798" y="294" class="t">4. Восемь силовых проушин; кольцо имеет механическое самоблокирование.</text>
  <text x="798" y="324" class="t">5. Красный элемент — независимый механический предохранительный клапан.</text>
  <text x="798" y="354" class="t">6. Управляемый выпуск отделён от предохранительного пути физически.</text>
  <text x="798" y="386" class="note">Все поверхности продукта разборные и видимые; глухих трубок в инструменте нет.</text>

  <rect x="770" y="438" width="470" height="296" rx="12" class="greenbox"/>
  <text x="798" y="474" class="h">Расчёт P2: привод и вал</text>
  <text x="798" y="510" class="t">Пиковый момент: 24 Н·м</text>
  <text x="798" y="540" class="t">Боковая нагрузка: 250 Н</text>
  <text x="798" y="570" class="t">Свободный вылет: 120 мм</text>
  <text x="798" y="600" class="t">Эквивалентное напряжение: 46,47 МПа</text>
  <text x="798" y="630" class="t">Расчётный прогиб: 0,095 мм</text>
  <text x="798" y="660" class="t">Предварительный статический запас: 3,66</text>
  <text x="798" y="700" class="note">Screening, не замена FEM/усталостного расчёта.</text>

  <rect x="1270" y="438" width="470" height="296" rx="12" class="orangebox"/>
  <text x="1298" y="474" class="h">Давление и выпуск</text>
  <text x="1298" y="510" class="t">Стендовая матрица: +20 / +40 / +60 кПа</text>
  <text x="1298" y="540" class="t">Усилие на крышку при +60 кПа: 2,08 кН</text>
  <text x="1298" y="570" class="t">Полное усилие с уплотнением: 3,08 кН</text>
  <text x="1298" y="600" class="t">На одну из 8 проушин: 0,385 кН</text>
  <text x="1298" y="630" class="t">Сброс +60 → +2 кПа: 2,06 Нл воздуха</text>
  <text x="1298" y="660" class="t">Целевой сброс: 30 / 60 / 90 с — проверяется стендом</text>
  <text x="1298" y="700" class="note">Уставки рецептов пока не утверждены.</text>

  <rect x="60" y="864" width="1680" height="236" rx="12" class="box"/>
  <text x="88" y="900" class="h">Что должно быть доказано до серийного корпуса</text>
  <text x="88" y="936" class="t">• 54 стендовых цикла: 2 инструмента × 3 давления × 3 декомпрессии × 3 повтора.</text>
  <text x="88" y="966" class="t">• Момент, RPM, температура, плотность/overrun, потеря объёма через 1/3/5/10 минут, выпечка и структура мякиша.</text>
  <text x="88" y="996" class="t">• Выбор между инструментами A и B — только по повторяемости результата, а не по рендеру.</text>
  <text x="88" y="1026" class="t">• Затем: FEM, усталость, швы/фланец, клапан, WPS/PQR, гидроиспытание и валидация пищевого контакта.</text>
  <text x="88" y="1070" class="small">HDA-1 / GA-02 / P2 / 28.07.2026 · Все размеры в мм, если не указано иное. Документ для выбора прототипа, не для производства.</text>
  <rect x="1455" y="1038" width="285" height="62" fill="#eef2f4" stroke="#9badb6" stroke-width="2"/>
  <text x="1475" y="1064" class="small">Статус: P2 — ПРЕДКОНСТРУКТОРСКИЙ</text>
  <text x="1475" y="1088" class="small">Нижней опоры вала: НЕТ</text>
</svg>
